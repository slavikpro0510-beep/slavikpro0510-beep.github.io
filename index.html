<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>ITSkillCheap Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4F6F0;
            --text-main: #1A1C18;
            --text-secondary: #43493E;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.5);
            --tag-bg: #E2E4D8;
            --btn-bg: #386A46;
            --btn-text: #FFFFFF;
            --price-free: #2E6C3F;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.7;
        }
        .blob-1 {
            width: 280px; height: 280px;
            background-color: #A6C8AE;
            top: -50px; left: -80px;
        }
        .blob-2 {
            width: 320px; height: 320px;
            background-color: #CDE3D0;
            bottom: -100px; right: -100px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 10px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        #courses-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }
        
        .course-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .course-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .course-platform {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--tag-bg);
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-price {
            font-size: 16px;
            font-weight: 700;
        }
        .price-free {
            color: var(--price-free);
        }

        .btn-view {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="header">
        <h1>ITSkillCheap</h1>
        <p>Минималистичный агрегатор скидок</p>
    </div>

    <div id="courses-container">
        <p style="text-align:center;">Загрузка данных...</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#F4F6F0');
        tg.setBackgroundColor('#F4F6F0');
        tg.ready();

        function formatPrice(price) {
            if (price === 0 || price === '0' || price === null) {
                return '<span class="course-price price-free">🎁 БЕСПЛАТНО</span>';
            }
            return `<span class="course-price">💰 ${price} ₽</span>`;
        }

        function renderCourses(courses) {
            const container = document.getElementById('courses-container');
            container.innerHTML = ''; 

            if (courses.length === 0) {
                container.innerHTML = '<p style="text-align:center;">Нет данных в базе.</p>';
                return;
            }

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="course-title">${course.title}</div>
                    <div class="course-platform">Платформа: ${course.platform}</div>
                    <div class="course-footer">
                        ${formatPrice(course.price)}
                        <a href="#" class="btn-view" onclick="tg.close()">Смотреть</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Твоя ссылка от ngrok
        const API_URL = 'https://evict-gear-cozy.ngrok-free.dev/api/courses'; 

        // Делаем запрос к твоему компу
        fetch(API_URL, {
            headers: {
                'ngrok-skip-browser-warning': 'true'
            }
        })
        .then(response => response.json())
        .then(data => renderCourses(data))
        .catch(error => {
            console.error('Ошибка:', error);
            document.getElementById('courses-container').innerHTML = '<p style="text-align:center;">Сервер не отвечает.</p>';
        });
    </script>
</body>
</html>
