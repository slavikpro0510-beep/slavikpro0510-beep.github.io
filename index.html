<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITSkillCheap Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4F6F0;
            --text-main: #1A1C18;
            --btn-bg: #386A46;
            --price-free: #2E6C3F; 
        }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-color);
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn { background: #E2E4D8; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #386A46; cursor: pointer; }
        .tab-btn.active { background: var(--btn-bg); color: #fff; }

        .filter-panel { background: rgba(255,255,255,0.7); padding: 10px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
        .filter-panel input { width: 70px; padding: 6px; border-radius: 8px; border: 1px solid #ccc; }
        
        .course-card { background: white; padding: 15px; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .course-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .course-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .btn-view { background: var(--btn-bg); color: white; padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="tabs">
            <button class="tab-btn active" onclick="setCategory('all', this)">Все</button>
            <button class="tab-btn" onclick="setCategory('python', this)">IT & Код</button>
            <button class="tab-btn" onclick="setCategory('other', this)">Хобби</button>
        </div>
        <div class="filter-panel">
            <input type="number" id="minPrice" placeholder="От ₽" oninput="applyFilters()">
            <input type="number" id="maxPrice" placeholder="До ₽" oninput="applyFilters()">
            <label style="font-size: 12px; display: flex; align-items: center;"><input type="checkbox" id="onlyFree" onchange="applyFilters()"> Бесплатные</label>
        </div>
    </div>

    <div id="courses-container" style="margin-top: 15px;">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let allCourses = [];
        let currentCategory = 'all';

        function renderCourses(courses) {
            const container = document.getElementById('courses-container');
            container.innerHTML = '';
            courses.forEach(c => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="course-title">${c.title}</div>
                    <div style="font-size: 12px; color: #666;">${c.platform}</div>
                    <div class="course-footer">
                        <span>💰 ${c.price}</span>
                        <button class="btn-view" onclick="tg.openLink('${c.url}')">Смотреть</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const min = parseInt(document.getElementById('minPrice').value) || 0;
            const max = parseInt(document.getElementById('maxPrice').value) || 999999;
            const onlyFree = document.getElementById('onlyFree').checked;
            
            const filtered = allCourses.filter(c => {
                let matchCat = true;
                if (currentCategory === 'python') matchCat = c.title.toLowerCase().includes('python') || c.title.toLowerCase().includes('code');
                if (currentCategory === 'other') matchCat = !(c.title.toLowerCase().includes('python') || c.title.toLowerCase().includes('code'));
                
                const priceNum = parseInt(c.price.replace(/\D/g, '')) || 0;
                let matchPrice = (priceNum >= min && priceNum <= max);
                if (onlyFree) matchPrice = (priceNum === 0);
                
                return matchCat && matchPrice;
            });
            renderCourses(filtered);
        }

        fetch('https://evict-gear-cozy.ngrok-free.dev/api/courses', { headers: { 'ngrok-skip-browser-warning': 'true' } })
        .then(res => res.json())
        .then(data => {
            allCourses = data;
            applyFilters();
        });
    </script>
</body>
</html>
