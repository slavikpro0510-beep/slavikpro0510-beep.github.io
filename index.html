<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITSkillCheap Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4F6F0;
            --text-main: #1A1C18;
            --text-secondary: #43493E;
            --btn-bg: #386A46;
            --price-free: #2E6C3F; 
        }
        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        
        /* Липкая шапка */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-color);
            padding: 10px 0;
            margin-top: -10px; 
            border-bottom: 1px solid rgba(0,0,0,0.05); 
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tabs::-webkit-scrollbar { display: none; } 
        
        .tab-btn { background: #E2E4D8; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #386A46; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--btn-bg); color: #fff; }

        .filter-panel { background: rgba(255,255,255,0.7); padding: 10px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        
        /* Стили для строки поиска */
        .filter-panel input[type="text"] { 
            width: 100%; 
            padding: 8px 12px; 
            border-radius: 10px; 
            border: 1px solid #ccc; 
            font-family: inherit; 
            font-size: 14px; 
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        
        .filter-panel input[type="number"] { width: 70px; padding: 6px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; }
        
        .course-card { background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .course-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .course-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .price-text { font-weight: 600; font-size: 14px; }
        .price-free { color: var(--price-free); }
        .btn-view { background: var(--btn-bg); color: white; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; border: none; cursor: pointer; font-family: inherit; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="tabs">
            <button class="tab-btn active" onclick="setCategory('all', this)">Все</button>
            <button class="tab-btn" onclick="setCategory('python', this)">IT & Код</button>
            <button class="tab-btn" onclick="setCategory('other', this)">Хобби</button>
        </div>

        <div class="filter-panel">
            <input type="text" id="searchQuery" placeholder="🔍 Поиск курса (например: рисование, python)..." oninput="applyFilters()">
            
            <input type="number" id="minPrice" placeholder="От ₽" oninput="applyFilters()">
            <input type="number" id="maxPrice" placeholder="До ₽" oninput="applyFilters()">
            <label style="font-size: 12px; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="onlyFree" onchange="applyFilters()"> Только бесплатные
            </label>
        </div>
    </div>

    <div id="courses-container" style="margin-top: 15px;">Загрузка данных...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let allCourses = [];
        let currentCategory = 'all';

        // Реализация алгоритма Левенштейна для поиска опечаток
        function levenshtein(a, b) {
            const tmp = [];
            for (let i = 0; i <= a.length; i++) { tmp[i] = [i]; }
            for (let j = 0; j <= b.length; j++) { tmp[0][j] = j; }
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    tmp[i][j] = Math.min(tmp[i - 1][j] + 1, tmp[i][j - 1] + 1, tmp[i - 1][j - 1] + cost);
                }
            }
            return tmp[a.length][b.length];
        }

        // Функция "умного" нечеткого поиска
        function fuzzyMatch(text, query) {
            text = text.toLowerCase().trim();
            query = query.toLowerCase().trim();
            if (!query) return true;

            // 1. Прямое совпадение подстроки
            if (text.includes(query)) return true;

            const textWords = text.split(/[\s,.\-():«»"']+/).filter(w => w.length > 0);
            const queryWords = query.split(/[\s,.\-():«»"']+/).filter(w => w.length > 0);

            if (queryWords.length === 0) return true;

            let matchedWordsCount = 0;

            for (const qWord of queryWords) {
                let wordMatched = false;

                for (const tWord of textWords) {
                    // Проверка на частичное совпадение слов
                    if (tWord.includes(qWord) || qWord.includes(tWord)) {
                        wordMatched = true;
                        break;
                    }

                    // Проверка на опечатки (если слово длиннее 3 символов)
                    if (qWord.length >= 3 && tWord.length >= 3) {
                        const maxDist = qWord.length > 5 ? 2 : 1; // Допускаем 1-2 ошибки в зависимости от длины
                        if (levenshtein(qWord, tWord) <= maxDist) {
                            wordMatched = true;
                            break;
                        }
                    }
                }

                if (wordMatched) matchedWordsCount++;
            }

            // Если совпало большинство слов из запроса, возвращаем true
            return matchedWordsCount / queryWords.length >= 0.7;
        }

        function formatPrice(price) {
            if (!price || price == 0 || price == '-' || String(price).toLowerCase().includes('бесплатно')) {
                return `<span class="price-text price-free">🎁 БЕСПЛАТНО</span>`;
            }
            return `<span class="price-text">💰 ${price} ₽</span>`;
        }

        function getNumericPrice(price) {
            if (!price || price == '-' || String(price).toLowerCase().includes('бесплатно')) return 0;
            return parseInt(String(price).replace(/\D/g, '')) || 0;
        }

        function renderCourses(courses) {
            const container = document.getElementById('courses-container');
            container.innerHTML = '';
            
            if (courses.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">Курсов не найдено.</p>';
                return;
            }

            courses.forEach(c => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="course-title">${c.title}</div>
                    <div style="font-size: 12px; color: #666;">Платформа: <b>${c.platform}</b></div>
                    <div class="course-footer">
                        ${formatPrice(c.price)}
                        <button class="btn-view" onclick="tg.openLink('${c.url}')">Смотреть</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const min = parseInt(document.getElementById('minPrice').value) || 0;
            const max = parseInt(document.getElementById('maxPrice').value) || 999999;
            const onlyFree = document.getElementById('onlyFree').checked;
            const searchQuery = document.getElementById('searchQuery').value; // Получаем текст поиска
            
            const keywords = ['panda', 'python', 'цеп', 'code', 'web', 'react', 'aws', 'machine', 'sql', 'разработ', 'figma'];

            const filtered = allCourses.filter(c => {
                let matchCat = true;
                if (currentCategory === 'python') matchCat = keywords.some(k => c.title.toLowerCase().includes(k));
                if (currentCategory === 'other') matchCat = !keywords.some(k => c.title.toLowerCase().includes(k));
                
                const p = getNumericPrice(c.price);
                let matchPrice = (p >= min && p <= max);
                if (onlyFree) matchPrice = (p === 0);

                // Применяем умный поиск к названию курса и названию платформы
                let matchSearch = fuzzyMatch(c.title, searchQuery) || fuzzyMatch(c.platform, searchQuery);

                return matchCat && matchPrice && matchSearch;
            });
            renderCourses(filtered);
        }

        // НЕ ЗАБУДЬ: если ты перезапускал ngrok, вставь сюда актуальную ссылку!
        const API_URL = 'https://evict-gear-cozy.ngrok-free.dev/api/courses';

        fetch(API_URL, { headers: { 'ngrok-skip-browser-warning': 'true' } })
        .then(res => res.json())
        .then(data => {
            allCourses = data;
            applyFilters();
        })
        .catch(() => document.getElementById('courses-container').innerHTML = '<p style="text-align:center; margin-top:20px;">Ошибка сервера.</p>');
    </script>
</body>
</html>
