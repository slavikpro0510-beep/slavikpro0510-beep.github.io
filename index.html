<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITSkillCheap Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F4F6F0;
            --text-main: #1A1C18;
            --text-secondary: #43493E;
            --card-bg: rgba(255, 255, 255, 0.75);
            --btn-bg: #386A46;
            --btn-text: #FFFFFF;
        }

        body { font-family: 'Roboto', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: #E2E4D8; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #386A46; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--btn-bg); color: var(--btn-text); }

        .course-card { background: var(--card-bg); padding: 15px; border-radius: 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .course-title { font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .course-platform { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .course-footer { display: flex; justify-content: space-between; align-items: center; }
        .btn-view { background: var(--btn-bg); color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterCourses('all', this, 'ВСЕ ДОСТУПНЫЕ КУРСЫ')">Все</button>
        <button class="tab-btn" onclick="filterCourses('python', this, 'РАЗРАБОТКА & IT')">IT & Код</button>
        <button class="tab-btn" onclick="filterCourses('other', this, 'ГУМАНИТАРНЫЕ & ХОББИ')">Хобби</button>
    </div>

    <div id="courses-container">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let allCourses = [];

        function renderCourses(courses, title) {
            const container = document.getElementById('courses-container');
            container.innerHTML = `<h3 style="margin: 0 0 15px 0; font-size: 16px; color: #43493E;">${title}</h3>`;

            if (courses.length === 0) {
                container.innerHTML += '<p style="text-align:center;">Курсы не найдены.</p>';
                return;
            }

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div class="course-title">${course.title}</div>
                    <div class="course-platform">Платформа: ${course.platform}</div>
                    <div class="course-footer">
                        <span>💰 ${course.price || 'Бесплатно'}</span>
                        <a href="#" class="btn-view" onclick="tg.close()">Смотреть</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCourses(category, btnElement, title) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            let filtered = [];
            const keywords = ['panda', 'python', 'цеп'];

            if (category === 'all') filtered = allCourses;
            else if (category === 'python') {
                filtered = allCourses.filter(c => keywords.some(k => c.title.toLowerCase().includes(k)));
            } else if (category === 'other') {
                filtered = allCourses.filter(c => !keywords.some(k => c.title.toLowerCase().includes(k)));
            }
            renderCourses(filtered, title);
        }

        const API_URL = 'https://evict-gear-cozy.ngrok-free.dev/api/courses';

        fetch(API_URL, { headers: { 'ngrok-skip-browser-warning': 'true' } })
        .then(response => response.json())
        .then(data => {
            allCourses = data;
            renderCourses(allCourses, 'ВСЕ ДОСТУПНЫЕ КУРСЫ');
        })
        .catch(err => {
            document.getElementById('courses-container').innerHTML = 'Ошибка соединения с сервером.';
        });
    </script>
</body>
</html>
