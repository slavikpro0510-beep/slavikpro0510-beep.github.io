<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ITSkillCheap Web App</title>
    <!-- Подключаем API Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем шрифт Roboto, как в презентации Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Цветовая палитра из презентации Material You */
        :root {
            --bg-color: #F4F6F0; /* Светлый кремово-зеленый фон */
            --text-main: #1A1C18;
            --text-secondary: #43493E;
            --card-bg: rgba(255, 255, 255, 0.75); /* Стекло */
            --card-border: rgba(255, 255, 255, 0.5);
            --tag-bg: #E2E4D8;
            --btn-bg: #386A46;
            --btn-text: #FFFFFF;
            --price-free: #2E6C3F;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- РАЗМЫТЫЕ ФОНОВЫЕ КЛЯКСЫ (BLUR) --- */
        .blob {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.7;
        }
        .blob-1 {
            width: 280px; height: 280px;
            background-color: #A6C8AE; /* Мятно-зеленый */
            top: -50px; left: -80px;
        }
        .blob-2 {
            width: 320px; height: 320px;
            background-color: #CDE3D0; /* Светло-зеленый */
            bottom: -100px; right: -100px;
        }
        .blob-3 {
            width: 200px; height: 200px;
            background-color: #8EB397; /* Более насыщенный */
            top: 40%; left: 60%;
            filter: blur(100px);
        }

        /* --- ШАПКА ПРИЛОЖЕНИЯ --- */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 10px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.4;
        }

        /* --- КАРТОЧКИ КУРСОВ (ВИДЖЕТЫ) --- */
        #courses-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 30px;
        }
        
        .course-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px; /* Мягкие углы как в Android */
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            transition: transform 0.1s ease;
        }
        .course-card:active {
            transform: scale(0.98);
        }

        .course-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .course-platform {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--tag-bg);
            padding: 4px 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .course-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .course-price {
            font-size: 16px;
            font-weight: 700;
        }
        .price-free {
            color: var(--price-free);
        }

        .btn-view {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(56, 106, 70, 0.3);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Фоновые кляксы -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="header">
        <h1>ITSkillCheap</h1>
        <p>Минималистичный агрегатор скидок<br>на образовательные ИТ-курсы</p>
    </div>

    <!-- Контейнер, куда скрипт вставит карточки -->
    <div id="courses-container"></div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        
        // Говорим телеграму, что цвет фона и хедера берем из нашей темы
        tg.setHeaderColor('#F4F6F0');
        tg.setBackgroundColor('#F4F6F0');
        tg.ready();

        // Имитация получения данных из твоего API (БД SQLite3)
        // На защите скажешь: "Сейчас данные подгружаются из JSON-массива для симуляции ответа от бэкенда"
        const apiData = [
            {
                title: "⚡ Электрические цепи постоянного тока",
                platform: "Stepik",
                price: 0,
                link: "#"
            },
            {
                title: "🔹 Pandas для собеседований: 50 задач",
                platform: "Stepik",
                price: 390,
                link: "#"
            },
            {
                title: "🐍 Python-разработчик с нуля",
                platform: "Stepik",
                price: 1500,
                link: "#"
            }
        ];

        // Функция форматирования цены (Распознавание цен из презентации)
        function formatPrice(price) {
            if (price === 0 || price === null) {
                return '<span class="course-price price-free">🎁 БЕСПЛАТНО</span>';
            }
            return `<span class="course-price">💰 ${price} ₽</span>`;
        }

        // Функция отрисовки карточек на странице
        function renderCourses(courses) {
            const container = document.getElementById('courses-container');
            container.innerHTML = ''; // Очищаем контейнер перед загрузкой

            courses.forEach(course => {
                const card = document.createElement('div');
                card.className = 'course-card';
                
                card.innerHTML = `
                    <div class="course-title">${course.title}</div>
                    <div class="course-platform">Платформа: ${course.platform}</div>
                    <div class="course-footer">
                        ${formatPrice(course.price)}
                        <a href="${course.link}" class="btn-view" onclick="tg.close()">Смотреть</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Запускаем рендер при загрузке страницы
        renderCourses(apiData);
    </script>
</body>
</html>
